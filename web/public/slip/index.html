<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#171717">
<title>GRKU Plus · Slip</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/slip/slip.css?v=4">
</head>
<body>
<main class="wrap">
  <header class="bar"><span class="mark">GRKU<b>.</b></span><span class="tag">Plus</span></header>
  <section class="card" id="card" hidden>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="sum">
      <p class="plan" id="plan"></p>
      <p class="amount" id="amount"></p>
      <dl>
        <dt id="receiverLabel"></dt><dd id="receiver"></dd>
        <dt id="orderLabel"></dt><dd class="mono" id="order"></dd>
      </dl>
      <p class="expires" id="expires"></p>
    </div>
    <label class="drop" id="drop" for="file">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M9 9h6v6H9z"/></svg>
      <span class="pick" id="pick"></span>
      <span class="hint" id="pickHint"></span>
    </label>
    <input id="file" type="file" accept="image/*" hidden>
    <p class="status" id="status" role="status"></p>
  </section>
  <section class="card done" id="done" hidden>
    <div class="tick" aria-hidden="true">✓</div>
    <h1 id="paidTitle"></h1>
    <p class="lead" id="paidText"></p>
  </section>
  <p class="error" id="fatal" hidden></p>
</main>
<script src="/slip/slip.js?v=4"></script>
</body>
</html>
