# Date Imprint: the local time on each recorded picture, as a film data back
# exposes it.
id = "DATE"
version = 1
# The default place in ADJ and in MENU: Film Look, Framing, Guides, Date, Grain.
order = 40
sources = ["stamp.c"]
# Tile n shows style n. Tile 0 is the module tile, for Off at the root.
tiles = [
    "tiles/0-module.png",
    "tiles/1-yy-m-d.png",
    "tiles/2-yy-m-d-time.png",
    "tiles/3-m-d-yy.png",
    "tiles/4-d-m-yy.png",
    "tiles/5-d-m-yy-time.png",
]

# 0 Off, 1 'YY M D, 2 'YY M D H:MM, 3 M D 'YY, 4 D M 'YY, 5 D M 'YY H:MM.
[[settings]]
key = "STYLE"
values = 6
saved = true
public = true

# The digits: 0 classic seven-segment, 1 GR1s dot matrix, 2 GR II.
[[settings]]
key = "LOOK"
values = 3
saved = true
public = true

# Where the date goes on a vertical picture: 0 film (the bottom right of the
# sensor frame, as a film data back prints it), 1 upright (the bottom right of
# the picture turned upright).
[[settings]]
key = "POSITION"
values = 2
saved = true
public = true

# The viewfinder icon: 0 on, 1 off.
[[settings]]
key = "ICON"
values = 2
saved = true
public = true

# The color of the light: 0 standard (the color of each font: orange for
# Classic and GR II, yellow for GR1s), 1 orange, 2 white, 3 sepia, 4 LED
# yellow. A monochrome picture gets white light.
[[settings]]
key = "COLOR"
values = 5
saved = true
public = true

# The size of the text: 0 S, 1 M (the size before 1.9), 2 M-L, 3 L.
[[settings]]
key = "SIZE"
values = 4
default = 1
saved = true
public = true

# Where the line of the date goes: 0 bottom right, 1 bottom left, 2 top
# right, 3 split (the date at the bottom left, the caption at the bottom
# right). POSITION still chooses the sensor frame or the upright picture.
[[settings]]
key = "CORNER"
values = 4
saved = true
public = true

# A soft glow around the text: 0 off, 1 on. GR II prints flat pixels and has
# none.
[[settings]]
key = "GLOW"
values = 2
saved = true
public = true

# The caption before the date: 0 off, then the texts of stamp.c (captions).
# A new caption goes at the end, so that a saved value keeps its text.
[[settings]]
key = "CAPTION"
values = 9
saved = true
public = true

# Where the camera has a native settings page, it shows the style, the
# placement, the look of the text, the caption, and the icon. In MENU, the
# Options and Order rows leave room for seven of them: the style and the
# position show only on the page that Fn opens in ADJ.
[page]
setting = "STYLE"
off_row = true
settings = ["STYLE", "POSITION", "CORNER", "SIZE", "LOOK", "COLOR", "GLOW", "CAPTION", "ICON"]
# The Options row in MENU turns each style on or off in ADJ.
options = true

[[filters]]
apply = "date_apply"
setting = "STYLE"
stage = "mark"

[[indicators]]
id = "date"
placement = "status_row"
enabled = { all = [{ setting = "STYLE", not_equals = 0 }, { setting = "ICON", equals = 0 }] }
# The viewfinder shows the format as live-view text: the core label after DATE
# for each STYLE (YMD, YMD HM, MDY, DMY, DMY HM). STYLE 0 maps to DATE, but
# the indicator is hidden while Date Imprint is Off.
icon = { setting = "STYLE", label = "DATE" }
