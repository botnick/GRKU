# Diffusion: the glow of a highlight diffusion filter (Black Pro-Mist 1/8,
# 1/4, 1/2) on each recorded JPEG, with the Black Mist veil of the filter over
# the shadows and the horizontal Streak of an anamorphic lens; and, on its
# own, the Film Softness of a scanned film frame. The live view and DNG
# files stay as they are. Ported from the HDF Glow module of
# MustafaCisse/GRKit (MIT), without its halation ring: Glow has Halation.
id = "DIFFUSE"
version = 1
# The default place in ADJ and in MENU: after Glow (45), before Grain (50).
order = 47
sources = ["diffusion.c", "softness.c", "softness_kernels.c"]
# The module tile, then the Off, 1/8, 1/4, and 1/2 icons of the filter
# (tiles 1 to 4) and the Off, Low, Medium, and High icons of Film Softness
# (tiles 5 to 8) in ADJ.
tiles = [
    "tiles/0-module.png",
    "tiles/off-filter.png",
    "tiles/1-eighth.png",
    "tiles/2-quarter.png",
    "tiles/3-half.png",
    "tiles/off-softness.png",
    "tiles/softness-low.png",
    "tiles/softness-medium.png",
    "tiles/softness-high.png",
]

# 0 Off, 1 1/8, 2 1/4, 3 1/2.
[[settings]]
key = "STRENGTH"
values = 4
saved = true
public = true

# The veil of a Black Pro-Mist over the shadows: 0 Off, 1 Light, 2 Heavy. It
# scales with the strength, and the core calls the filter only while the
# strength is on, so Black Mist acts only with a diffusion strength.
[[settings]]
key = "MIST"
values = 3
saved = true
public = true

# The horizontal flare of an anamorphic lens from point lights: 0 Off,
# 1 Blue, 2 Amber. As Black Mist, it acts only with a diffusion strength.
[[settings]]
key = "STREAK"
values = 3
saved = true
public = true

# The softness of a scanned film frame: 0 Off, 1 Low, 2 Medium, 3 High. It
# has its own filter, so it acts with or without a diffusion strength.
# Appended: the state file keeps the settings by their place.
[[settings]]
key = "SOFTNESS"
values = 4
saved = true
public = true

# Two children, as Glow: the filter (strength, Black Mist, Streak) and Film
# Softness, each on or off on its own.
[page]
kind = "group"

[[page.children]]
key = "FILTER"
settings = ["STRENGTH", "MIST", "STREAK"]
icon = { setting = "STRENGTH", first_tile = 1 }

[[page.children]]
key = "SOFTNESS"
settings = ["SOFTNESS"]
icon = { setting = "SOFTNESS", first_tile = 5 }

# Stage frame, before the date (mark), so the date does not glow.
[[filters]]
apply = "diffusion_apply"
setting = "STRENGTH"
stage = "frame"

# After the glow of the filter, as a scan comes after the light reached the
# film; before the date, so the date stays sharp.
[[filters]]
apply = "softness_apply"
setting = "SOFTNESS"
stage = "frame"
