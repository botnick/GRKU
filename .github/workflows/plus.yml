name: Plus

# Deploys the GRKU Plus service (services/plus) to Cloudflare Workers when a push to main
# changes it. The repository secrets hold the Cloudflare token (Workers Scripts, D1 and
# Workers KV edit for the account) and the service's own secrets, which the deploy writes
# into the Worker: KEY_SECRET (HMAC of the keys), MAIL_PASS (the noreply mailbox),
# EASYSLIP_KEY (slip verification), TURNSTILE_SECRET (the bot check of the order form). Add
# TRUEMONEY_PHONE to the list below and to the repository secrets to turn the gift links on;
# wrangler-action fails on a listed secret that the repository lacks. PROMPTPAY_ID and RECEIVER_NAME are plain vars in
# wrangler.toml: buyers see the PromptPay ID in the QR anyway.
# The D1 database is created once by hand (`wrangler d1 create grku-plus`) and its id is in
# services/plus/wrangler.toml; the deploy applies schema.sql, which only creates what is
# missing.
on:
  push:
    branches: [main]
    paths:
      - services/plus/**
      - .github/workflows/plus.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plus
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/plus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/plus/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Apply the database schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 execute grku-plus --remote --file schema.sql
      - name: Deploy the Worker and its secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/plus
          packageManager: pnpm
          command: deploy
          secrets: |
            KEY_SECRET
            MAIL_PASS
            EASYSLIP_KEY
            TURNSTILE_SECRET
        env:
          KEY_SECRET: ${{ secrets.KEY_SECRET }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          EASYSLIP_KEY: ${{ secrets.EASYSLIP_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
