name = "grku-plus"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The orders, the slips that paid them, and what each buyer owns.
[[d1_databases]]
binding = "DB"
database_name = "grku-plus"
database_id = "e67fb824-cef1-4d18-bd37-21745eb1efd5"

[vars]
# The site that the magic links and the CORS allow.
SITE_URL = "https://grku.app"
EXTRA_ORIGINS = "https://www.grku.app,http://localhost:8787,http://localhost:5173,http://localhost:4173"
# The PromptPay that receives the money: a phone (0812345678), a national ID (13 digits), or an
# e-wallet ID (15 digits). Set as a secret in production: `wrangler secret put PROMPTPAY_ID`.
PROMPTPAY_ID = "004999119724275"
# A part of the receiver's name as the bank shows it on a slip, to check that the money came to
# us (optional; empty skips the check).
RECEIVER_NAME = "ธนวัฒน์"
# The last digits of the bank account behind the PromptPay, as bank slips show it (KBank: xxx-x-x3117-x).
RECEIVER_ACCOUNTS = "3117"
# The receiver's name as the page shows it next to the QR.
RECEIVER_DISPLAY = "นาย ธนวัฒน์ ช่างไม้"
# TrueMoney gift links (อั่งเปา) on the page: "on" or "off". TrueMoney's redeem endpoint answers
# Workers with a 403 bot-protection page, so the Worker redeems through a proxy on a Thai home line
# (ANGPAO_PROXY, with the secret ANGPAO_PROXY_KEY). /angpao/probe shows whether that path answers.
TRUEMONEY_LINKS = "on"
ANGPAO_PROXY = "https://tw-angpao.nuxe.dev"
# slipok | easyslip | mock. `mock` accepts any slip for the amount of the order (development only).
SLIP_PROVIDER = "easyslip"
SLIPOK_BRANCH = ""
MAIL_FROM = "GRKU <noreply@grku.app>"
# The hosting mailbox that sends the mails (SMTP, STARTTLS). The host must be a name on the
# server's certificate (DirectAdmin issues Let's Encrypt for mail.grku.app, renewed automatically).
MAIL_HOST = "mail.grku.app"
MAIL_PORT = "587"
MAIL_USER = "noreply@grku.app"
# Secrets: KEY_SECRET (HMAC of the keys), SLIPOK_KEY or EASYSLIP_KEY, MAIL_PASS (or RESEND_KEY as the fallback mailer).

# ---- The GRKU assistant (src/chat) -----------------------------------------------------------------
# "off" closes the assistant at once.
CHAT_ENABLED = "on"
# Origins of site previews for CORS (Cloudflare Pages branch previews), and the hostnames whose
# Turnstile tokens open a chat besides grku.app (each must also be a hostname of the Turnstile widget).
PREVIEW_ORIGINS = "https://*.grku-site.pages.dev"
CHAT_TURNSTILE_HOSTS = ""
# Limits: messages a day per session (free / GRKU Plus), per IP for the free tier, per minute per
# IP; characters in; tokens out; turns of history; violations an hour before a cool-down.
CHAT_FREE_PER_DAY = "15"
CHAT_PLUS_PER_DAY = "100"
CHAT_IP_PER_DAY = "30"
CHAT_PER_MINUTE = "6"
CHAT_MAX_INPUT = "600"
CHAT_MAX_OUTPUT_FREE = "600"
CHAT_MAX_OUTPUT_PLUS = "1200"
CHAT_HISTORY_TURNS = "8"
CHAT_VIOLATIONS_PER_HOUR = "4"
# The kill switch: the whole site's messages and tokens a day, sized inside the free quotas below.
CHAT_DAILY_MESSAGES = "600"
CHAT_DAILY_TOKENS = "6000000"
CHAT_SESSION_HOURS = "12"
CHAT_IMAGE_WEIGHT = "2"
CHAT_IMAGE_FREE_PER_DAY = "3"
CHAT_IMAGE_PLUS_PER_DAY = "30"
CHAT_IMAGE_DAILY = "300"
# Paid fallback: on. Free first (the AI Studio free key, then OpenRouter :free), then paid Gemini
# through OpenRouter (never by billing the AI Studio project, which would end its free tier). Only
# the models listed, only with a price below, under these caps; the free tier may use at most
# CHAT_PAID_FREE_SHARE percent of the month, so GRKU Plus never runs out because of free traffic.
CHAT_ALLOW_PAID = "1"
CHAT_PAID_TIERS = "free,plus"
CHAT_PAID_MODELS = "google/gemini-3.1-flash-lite,google/gemini-3.8-flash,google/gemini-3.1-pro-preview"
CHAT_PAID_MONTHLY_USD = "10"
CHAT_PAID_DAILY_USD = "1"
CHAT_PAID_FREE_SHARE = "50"
# GRKU Plus: "flash" (Flash on the free key with high thinking, then paid Flash, then paid Pro) or
# "pro" (paid Pro at once). Plus never gets the free tier's models.
CHAT_PLUS_TIER = "flash"
CHAT_PRO_MODELS = "google/gemini-3.1-pro-preview"
CHAT_HISTORY_TURNS_PLUS = "16"
# Provider 1: Google AI Studio, Gemini API free tier, OpenAI-compatible endpoint. Secret: CHAT_API_KEY.
# Free: Flash-Lite with low thinking; Plus: Flash with high thinking. _RPD is our own daily cap per
# model, under the free quota that AI Studio shows for the project (check there).
CHAT_NAME = "gemini"
CHAT_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
CHAT_MODEL_FREE = "gemini-flash-lite-latest"
CHAT_MODEL_PLUS = "gemini-flash-latest"
CHAT_REASONING_FREE = "low"
CHAT_REASONING_PLUS = "high"
CHAT_RPD = "gemini-flash-latest=200,gemini-flash-lite-latest=900"
# Provider 2: OpenRouter ":free" models (the code refuses any other model there), free tier only.
# Off: on 2026-11-25 the free Gemma models answered 429 (a shared upstream pool) to every test
# question, so a free visitor would only wait longer before the paid fallback. To turn on, list
# models here, such as "google/gemma-4-31b-it:free". Secret: CHAT2_API_KEY.
CHAT2_NAME = "openrouter"
CHAT2_BASE_URL = "https://openrouter.ai/api/v1"
CHAT2_MODEL_FREE = ""
CHAT2_RPD = "45"
# Provider 3: paid Gemini through OpenRouter, Google's own servers only, at most these prices (US
# dollars per million tokens in/out). Secret: CHAT3_API_KEY (the OpenRouter key).
CHAT3_NAME = "paid"
CHAT3_PAID = "1"
CHAT3_BASE_URL = "https://openrouter.ai/api/v1"
CHAT3_MODEL_FREE = "google/gemini-3.1-flash-lite"
CHAT3_MODEL_PLUS = "google/gemini-3.8-flash"
CHAT3_REASONING_FREE = "low"
CHAT3_REASONING_PLUS = "high"
CHAT3_ROUTING = "google-vertex,google-ai-studio"
CHAT3_PRICES = "google/gemini-3.1-flash-lite=0.25/1.5,google/gemini-3.8-flash=0.825/4.125,google/gemini-3.1-pro-preview=2/12"
# Provider 4 (optional): Cloudflare Workers AI, free daily allocation. Secrets: CHAT4_BASE_URL
# (https://api.cloudflare.com/client/v4/accounts/<account id>/ai/v1) and CHAT4_API_KEY.
CHAT4_NAME = "workers-ai"
CHAT4_MODEL_FREE = "@cf/google/gemma-3-12b-it"
CHAT4_RPD = "25"
