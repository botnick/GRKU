name = "grku-plus"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The orders, the slips that paid them, and what each buyer owns.
[[d1_databases]]
binding = "DB"
database_name = "grku-plus"
database_id = "e67fb824-cef1-4d18-bd37-21745eb1efd5"

[vars]
# The site that the magic links and the CORS allow.
SITE_URL = "https://grku.app"
EXTRA_ORIGINS = "https://www.grku.app,http://localhost:8787,http://localhost:5173,http://localhost:4173"
# The PromptPay that receives the money: a phone (0812345678), a national ID (13 digits), or an
# e-wallet ID (15 digits). Set as a secret in production: `wrangler secret put PROMPTPAY_ID`.
PROMPTPAY_ID = "004999119724275"
# A part of the receiver's name as the bank shows it on a slip, to check that the money came to
# us (optional; empty skips the check).
RECEIVER_NAME = "ธนวัฒน์"
# The last digits of the bank account behind the PromptPay, as bank slips show it (KBank: xxx-x-x3117-x).
RECEIVER_ACCOUNTS = "3117"
# The receiver's name as the page shows it next to the QR.
RECEIVER_DISPLAY = "นาย ธนวัฒน์ ช่างไม้"
# TrueMoney gift links (อั่งเปา) on the page: "on" or "off". The redeem endpoint of TrueMoney answered
# this Worker with a 403 bot-protection page on 2026-11-10 (/angpao/probe shows the current answer),
# so the links stay off until it does not.
TRUEMONEY_LINKS = "off"
# slipok | easyslip | mock. `mock` accepts any slip for the amount of the order (development only).
SLIP_PROVIDER = "easyslip"
SLIPOK_BRANCH = ""
MAIL_FROM = "GRKU <noreply@grku.app>"
# The hosting mailbox that sends the mails (SMTP, STARTTLS). The host must be a name on the
# server's certificate (DirectAdmin issues Let's Encrypt for mail.grku.app, renewed automatically).
MAIL_HOST = "mail.grku.app"
MAIL_PORT = "587"
MAIL_USER = "noreply@grku.app"
# Secrets: KEY_SECRET (HMAC of the keys), SLIPOK_KEY or EASYSLIP_KEY, MAIL_PASS (or RESEND_KEY as the fallback mailer).
