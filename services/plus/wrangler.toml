name = "grku-plus"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The orders, the slips that paid them, and what each buyer owns.
[[d1_databases]]
binding = "DB"
database_name = "grku-plus"
database_id = "REPLACE_AFTER_wrangler_d1_create"

[vars]
# The site that the magic links and the CORS allow.
SITE_URL = "https://grku.app"
EXTRA_ORIGINS = "http://localhost:8787,http://localhost:5173,http://localhost:4173"
# The PromptPay that receives the money: a phone (0812345678), a national ID (13 digits), or an
# e-wallet ID (15 digits). Set as a secret in production: `wrangler secret put PROMPTPAY_ID`.
PROMPTPAY_ID = ""
# A part of the receiver's name as the bank shows it on a slip, to check that the money came to
# us (optional; empty skips the check).
RECEIVER_NAME = ""
# slipok | easyslip | mock. `mock` accepts any slip for the amount of the order (development only).
SLIP_PROVIDER = "easyslip"
SLIPOK_BRANCH = ""
MAIL_FROM = "GRKU <noreply@grku.app>"
# The hosting mailbox that sends the mails (SMTP, STARTTLS). The host must be a name on the
# server's certificate; mail.grku.app once DirectAdmin has a Let's Encrypt certificate for it.
MAIL_HOST = "botnixk.com"
MAIL_PORT = "587"
MAIL_USER = "noreply@grku.app"
# Secrets: KEY_SECRET (HMAC of the keys), SLIPOK_KEY or EASYSLIP_KEY, MAIL_PASS (or RESEND_KEY as the fallback mailer).
